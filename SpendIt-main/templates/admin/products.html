{% extends "base.html" %}{% block title %}Каталог · Admin{% endblock %}{% block content %}<div class="d-flex justify-content-between align-items-center gap-2 mb-4"><div><span class="eyebrow">catalog ops</span><h1 class="mt-2">Каталог</h1></div><a class="btn btn-gradient rounded-pill" href="{{ url_for('admin_add_product') }}"><i class="bi bi-plus-lg"></i> Добавить</a></div><div class="glass p-3 p-lg-4 table-responsive"><table class="table table-dark table-borderless align-middle mb-0"><thead><tr><th>ID</th><th>Товар</th><th>Категория</th><th>Цена</th><th>Рейтинг</th><th></th></tr></thead><tbody>{% for p in products %}<tr><td>{{ p.id }}</td><td><strong>{{ p.name }}</strong></td><td>{{ p.category }}</td><td>{{ p.price }} ₽</td><td>★ {{ '%.1f'|format(p.rating) }}</td><td class="text-end"><a class="btn btn-sm btn-outline-light" href="{{ url_for('admin_edit_product', product_id=p.id) }}"><i class="bi bi-pencil"></i></a><form class="d-inline" method="post" action="{{ url_for('admin_delete_product', product_id=p.id) }}"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить товар?')"><i class="bi bi-trash"></i></button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
