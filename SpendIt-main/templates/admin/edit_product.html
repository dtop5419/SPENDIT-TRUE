{% extends "base.html" %}{% block title %}Редактировать товар · Admin{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-xl-8"><div class="hero"><a href="{{ url_for('admin_products') }}" class="small-link">← Каталог</a><h1 class="mt-3">{{ product.name }}</h1><form method="post" class="mt-4"><div class="row g-3"><div class="col-md-8"><label class="muted small">Название</label><input class="form-control" name="name" value="{{ product.name }}" required></div><div class="col-md-4"><label class="muted small">Категория</label><input class="form-control" name="category" value="{{ product.category }}" required></div><div class="col-md-6"><label class="muted small">Цена</label><input class="form-control" type="number" name="price" value="{{ product.price }}" required></div><div class="col-md-6"><label class="muted small">Старая цена</label><input class="form-control" type="number" name="original_price" value="{{ product.original_price or '' }}"></div><div class="col-12"><label class="muted small">Описание</label><input class="form-control" name="desc" value="{{ product.desc }}" required></div><div class="col-12"><label class="muted small">Подробности</label><textarea class="form-control" name="details" rows="4" required>{{ product.details }}</textarea></div><div class="col-md-8"><label class="muted small">Изображение</label><input class="form-control" name="image" value="{{ product.image }}"></div><div class="col-md-4"><label class="muted small">Рейтинг</label><input class="form-control" type="number" step="0.1" min="0" max="5" name="rating" value="{{ product.rating }}"></div><div class="col-md-8"><label class="muted small">Теги</label><input class="form-control" name="tags" value="{{ product.tags }}"></div><div class="col-md-4 d-flex align-items-end"><label class="glass p-3 w-100"><input class="form-check-input me-2" type="checkbox" name="featured" {% if product.featured %}checked{% endif %}> Featured</label></div></div><button class="btn btn-gradient btn-lg w-100 rounded-4 mt-4">Сохранить изменения</button></form></div></div></div>{% endblock %}
