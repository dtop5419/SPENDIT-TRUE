{% extends "base.html" %}{% block title %}Новый товар · Admin{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-xl-8"><div class="hero"><a href="{{ url_for('admin_products') }}" class="small-link">← Каталог</a><h1 class="mt-3">Новый товар</h1><form method="post" class="mt-4"><div class="row g-3"><div class="col-md-8"><label class="muted small">Название</label><input class="form-control" name="name" required></div><div class="col-md-4"><label class="muted small">Категория</label><input class="form-control" name="category" list="cats" required><datalist id="cats">{% for cat in categories %}<option value="{{ cat }}">{% endfor %}</datalist></div><div class="col-md-6"><label class="muted small">Цена</label><input class="form-control" type="number" name="price" min="0" required></div><div class="col-md-6"><label class="muted small">Старая цена</label><input class="form-control" type="number" name="original_price"></div><div class="col-md-12"><label class="muted small">Краткое описание</label><input class="form-control" name="desc" required></div><div class="col-md-12"><label class="muted small">Подробности</label><textarea class="form-control" name="details" rows="4" required></textarea></div><div class="col-md-8"><label class="muted small">URL изображения</label><input class="form-control" name="image"></div><div class="col-md-4"><label class="muted small">Рейтинг</label><input class="form-control" name="rating" type="number" min="0" max="5" step="0.1" value="4.7"></div><div class="col-md-8"><label class="muted small">Теги через запятую</label><input class="form-control" name="tags" placeholder="гаджеты, подарок, дом"></div><div class="col-md-4 d-flex align-items-end"><label class="glass p-3 w-100"><input class="form-check-input me-2" type="checkbox" name="featured"> Показывать в featured</label></div></div><button class="btn btn-gradient btn-lg w-100 rounded-4 mt-4">Создать товар</button></form></div></div></div>{% endblock %}
